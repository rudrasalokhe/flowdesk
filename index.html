// Real-time synchronization with FastAPI backend (http://localhost:8000/leads)
async function syncFromBackend() {
  try {
    const res = await fetch(`${API_URL}/leads/`, { method: 'GET', headers: { 'Accept': 'application/json' } });
    if (res.ok) {
      const data = await res.json();
      const list = Array.isArray(data) ? data : (data.leads || data.items || []);
      if (Array.isArray(list) && list.length > 0) {
        backendConnected = true;
        // Direct live binding to PostgreSQL database records
        state.leads = list.map((item, idx) => ({
          id: 'lead-' + item.id,
          name: item.name || 'Unnamed Lead',
          email: item.email || '',
          company: item.company || 'Unknown Co',
          status: item.status || 'New',
          score: Number(item.score) || 75,
          rep: idx % reps.length,
          source: item.source || 'Website',
          value: 25000 + (idx * 4000),
          priority: item.priority || 'Medium',
          phone: item.phone || '',
          message: item.message || 'Live lead from PostgreSQL database.',
          events: [
            { title: 'Stored in PostgreSQL', text: `Database record #${item.id} received from FastAPI`, at: new Date().toLocaleTimeString() }
          ]
        }));
        persist();
        render();
      }
    }
  } catch (err) {
    backendConnected = false;
  }
}

ad</button></div></form><aside class="panel tip"><span class="uploadicon">${icon('spark',23)}</span><h2>Set your next win in motion.</h2><p>Good context makes great conversations. Capture what matters while it’s fresh.</p><ul><li>Sends directly to FastAPI POST /leads</li><li>Stored permanently in PostgreSQL.</li><li>Real-time sync across devices.</li></ul><div class="divider" style="margin:22px 0"></div><h3 style="font-size:13px">Have a list of leads?</h3><p style="margin:8px 0 16px">Bring your spreadsheet into LaunchPad in one go.</p>${btn('Import a CSV','imports','upload')}</aside></div>`}
async function submitLead(e){
  e.preventDefault();
  const data=Object.fromEntries(new FormData(e.target));
  const calcScore = Math.min(100,35+(data.company?20:0)+(data.message?25:0)+(data.phone?10:0));
  
  // Submit directly to FastAPI backend
  let backendId = null;
  try {
    const res = await fetch(`${API_URL}/leads/`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        name: data.name.trim(),
        company: data.company.trim(),
        email: data.email.trim(),
        phone: data.phone?.trim() || null,
        source: data.source || 'Website',
        score: calcScore,
        priority: data.priority || 'Medium',
        status: 'New',
        message: data.message?.trim() || null
      })
    });
    if (res.ok) {
      const saved = await res.json();
      backendId = saved.id;
    }
  } catch (err) {
    console.warn('Backend POST error, fallback to local', err);
  }

  const finalId = backendId ? ('lead-' + backendId) : ('lead-' + crypto.randomUUID());
  const l = {
    ...data,
    id: finalId,
    name: data.name.trim(),
    company: data.company.trim(),
    email: data.email.trim(),
    rep: Number(data.rep) || 0,
    value: Number(data.value) || 25000,
    status: 'New',
    score: calcScore,
    events: [{
      title: 'Lead created in PostgreSQL',
      text: backendId ? `Saved to DB with ID #${backendId}` : 'Saved locally',
      at: new Date().toLocaleString()
    }]
  };
  state.leads.unshift(l);
  persist();
  syncFromBackend();
  go('leads/' + l.id);
  toast(backendId ? 'Lead created and saved to PostgreSQL!' : 'Lead created locally.');
}

function parseCSV(text){const rows=[];let row=[],field='',quoted=false;text=text.replace(/^\uFEFF/,'');for(let i=0;i<text.length;i++){let c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){field+='"';i++}else quoted=!quoted}else if(c===','&&!quoted){row.push(field);field=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&text[i+1]==='\n')i++;row.push(field);if(row.some(x=>x.trim()))rows.push(row);row=[];field=''}else field+=c}if(quoted)throw Error('An opening quote is missing its closing quote. Please check your CSV.');row.push(field);if(row.some(x=>x.trim()))rows.push(row);return rows}
async function processFile(file){if(!file||importBusy)return;if(!/\.csv$/i.test(file.name)){toast('Please choose a CSV file.');return}if(file.size>10*1024*1024){toast('This file is larger than 10 MB. Split it into smaller files.');return}importBusy=true;try{const rows=parseCSV(await file.text());if(rows.length<2)throw Error('Your file needs a header row and at least one lead.');const headers=rows.shift().map(x=>x.trim().toLowerCase());if(!['name','email','company'].every(h=>headers.includes(h)))throw Error('Required column headers: name, email, company.');const seen=new Set(state.leads.map(l=>l.email.toLowerCase()));const accepted=[];const result={added:0,duplicates:0,errors:[]};const progress=document.getElementById('importprogress');if(progress)progress.style.display='block';for(let i=0;i<rows.length;i++){const r=Object.fromEntries(headers.map((h,j)=>[h,(rows[i][j]||'').trim()]));if(!r.name||!r.company||!/^\S+@\S+\.\S+$/.test(r.email)){result.errors.push({row:i+2,email:r.email,reason:'Missing name/company or invalid email'})}else if(seen.has(r.email.toLowerCase()))result.duplicates++;else if(r.value&&(isNaN(Number(r.value))||Number(r.value)<0)){result.errors.push({row:i+2,email:r.email,reason:'Value must be a non-negative number'})}else{seen.add(r.email.toLowerCase());accepted.push({id:'lead-'+crypto.randomUUID(),name:r.name,email:r.email,company:r.company,value:Number(r.value)||0,source:['Website','Referral','LinkedIn','Event','Phone'].includes(r.source)?r.source:'CSV import',status:'New',priority:'Medium',rep:0,score:55,phone:'',message:'',events:[{title:'Lead imported from CSV',text:file.name,at:new Date().toLocaleString()}]});result.added++}if(i%250===0||i===rows.length-1){const percent=Math.round((i+1)/rows.length*100);if(document.getElementById('importbar')){document.getElementById('importbar').style.width=percent+'%';document.getElementById('importpercent').textContent=percent+'%'}await new Promise(r=>setTimeout(r,0))}}state.leads.push(...accepted);state.imports.unshift({file:file.name,added:result.added,duplicates:result.duplicates,date:new Date().toLocaleDateString()});importResult=result;persist();toast(`${result.added} leads imported. ${result.duplicates} duplicates skipped.`)}catch(e){toast(e.message)}finally{importBusy=false;render()}}

function convertModal(id){const l=state.leads.find(x=>String(x.id)===String(id));showModal(l.status==='Won'?'A win worth celebrating.':'Make it a win.',`<p class="muted" style="margin-bottom:22px">${l.status==='Won'?'This opportunity is marked as won.':'Confirm that this opportunity has closed. This will move the lead to Won and record the event.'}</p><div class="panel panelbody"><div class="between"><strong>${esc(l.company)}</strong><strong class="green">${money(l.value||25000)}</strong></div><p class="muted small" style="margin-top:6px">${esc(l.name)} · ${esc(reps[l.rep||0]?.name||'Alex Morgan')}</p></div><div class="flex" style="justify-content:flex-end;margin-top:22px"><button class="btn" onclick="closeModal()">${l.status==='Won'?'Close':'Cancel'}</button>${l.status==='Won'?'':`<button class="btn primary" onclick="closeModal();changeStatus('${l.id}','Won')">Confirm won deal</button>`}</div>`)}
function repModal(i){const ls=state.leads.filter(l=>l.rep===i);showModal(reps[i].name+'’s pipeline',`<p class="muted small" style="margin-bottom:20px">${ls.length} assigned opportunities · ${money(ls.reduce((n,l)=>n+(l.value||25000),0))} total value</p>${ls.map(l=>`<a href="#/leads/${l.id}" onclick="closeModal()" class="between" style="padding:13px 0;border-top:1px solid var(--line)"><span><strong>${esc(l.name)}</strong><br><span class="muted small">${esc(l.company)}</span></span>${pill(l.status)}</a>`).join('')||'<p class="muted">No assigned leads yet.</p>'}`)}
function help(){showModal('A quick tour of LaunchPad.',`<div class="stack"><p class="muted">Explore every screen using the sidebar. Connected live to your FastAPI server.</p><div class="between"><span>Search leads</span><span class="kbd">Ctrl / ⌘ K</span></div><div class="between"><span>Close a dialog</span><span class="kbd">Esc</span></div><div class="divider"></div><p class="muted small">Try adding a lead (saves directly to PostgreSQL), moving a card on the board, logging a call, creating a task, or importing a CSV.</p><a class="btn" href="#/landing" onclick="closeModal()">Visit product website</a></div>`)}
function searchModal(){showModal('Find your next opportunity.',`<label class="searchbox" style="max-width:none">${icon('search',17)}<input id="globalsearch" placeholder="Search people or companies..." aria-label="Search all leads" autofocus oninput="searchResults(this.value)"></label><div id="searchresults" style="max-height:340px;overflow-y:auto;margin-top:18px"></div>`);searchResults('');setTimeout(()=>document.getElementById('globalsearch')?.focus(),0)}
function searchResults(q){const matches=state.leads.filter(l=>((l.name||'')+' '+(l.company||'')+' '+(l.email||'')).toLowerCase().includes(q.toLowerCase())).slice(0,8);document.getElementById('searchresults').innerHTML=matches.map(l=>`<a href="#/leads/${l.id}" onclick="closeModal()" class="between" style="padding:12px 0;border-bottom:1px solid var(--line)"><span><strong style="font-size:13px">${esc(l.name)}</strong><br><span class="muted small">${esc(l.company)}</span></span>${pill(l.status||'New')}</a>`).join('')||'<p class="muted" style="padding:15px 0">No leads match that search.</p>'}
function notificationPopover(){const old=document.getElementById('notepop');if(old){old.remove();return}const el=document.createElement('section');el.id='notepop';el.className='panel popover';el.innerHTML=`<div class="panelhead between"><h2>Notifications</h2><button class="iconbtn" aria-label="Close notifications" onclick="document.getElementById('notepop').remove()">${icon('close',15)}</button></div>${state.notes.slice(0,3).map(n=>`<a class="note" style="display:block" href="#/${n.route}" onclick="markRead('${n.id}',false)"><strong>${n.title}</strong><p>${n.text}</p></a>`).join('')}<a class="feedfoot" href="#/notifications">View all notifications</a>`;document.querySelector('.main').appendChild(el)}
function dateModal(){showModal('Choose a telemetry window.',`<p class="muted" style="margin-bottom:20px">Explore the sample chart across three time windows. KPI cards are a fixed 30-day snapshot.</p><div class="flex" style="justify-content:center">${['7D','30D','90D'].map(r=>`<button class="btn ${chartRange===r?'primary':''}" onclick="closeModal();setRange('${r}')">${r==='7D'?'Last 7 days':r==='30D'?'Last 30 days':'Last 90 days'}</button>`).join('')}</div>`)}
function setRange(r){chartRange=r;render()}
function downloadCSV(name,rows){const csv=rows.map(row=>row.map(value=>{let s=String(value??'');if(/^[=+@\-]/.test(s))s="'"+s;return '"'+s.replaceAll('"','""')+'"'}).join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Your download is ready.')}
function exportLeads(){const ls=location.hash.startsWith('#/leads')?filtered():state.leads;downloadCSV('launchpad-leads.csv',[['name','email','company','status','score','assigned_rep','source','value'],...ls.map(l=>[l.name,l.email,l.company,l.status,l.score,reps[l.rep||0]?.name||'Unassigned',l.source,l.value||25000])])}
function exportReport(){downloadCSV('launchpad-sample-report.csv',[['metric','value','period','data_type'],['Total leads',2846,'Sep 4 – Oct 3 2026','FastAPI + PostgreSQL'],['Qualified pipeline',428500,'Sep 4 – Oct 3 2026','Illustrative sample'],['Conversion rate',24.8,'Sep 4 – Oct 3 2026','Illustrative sample'],['Average response (seconds)',754,'Sep 4 – Oct 3 2026','Illustrative sample']])}
function render(){const route=location.hash.replace(/^#\/?/,'')||'dashboard';let body;switch(route){case'landing':document.getElementById('app').innerHTML=landing();document.title='LaunchPad — Your next stage of growth';return;case'login':document.getElementById('app').innerHTML=login();document.title='Sign in · LaunchPad';return;case'dashboard':body=dashboard();break;case'leads':body=leads();break;case'leads/new':body=createLead();break;case'tasks':body=tasks();break;case'analytics':body=analytics();break;case'team':body=team();break;case'imports':body=imports();break;case'notifications':body=notifications();break;default:body=route.startsWith('leads/')?detail(route.slice(6)):`<div class="empty"><h1>Page not found</h1>${btn('Back to overview','dashboard')}</div>`}document.getElementById('app').innerHTML=shell(route,body);document.title=(route==='dashboard'?'Overview':route==='leads/new'?'New lead':route.startsWith('leads/')?'Lead details':route[0].toUpperCase()+route.slice(1))+' · LaunchPad'}
window.addEventListener('hashchange',()=>{closeModal();render();window.scrollTo(0,0);if(location.hash==='#/leads'||location.hash==='#/dashboard')syncFromBackend();});
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key==='k'){e.preventDefault();if(document.getElementById('modal').open)closeModal();searchModal()}});
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal'){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeModal()}});
render();
</script></body></html>
