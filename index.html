// Direct Real-Time Synchronizer with your FastAPI backend (http://localhost:8000/leads)
async function syncFromBackend() {
  try {
    const res = await fetch(`${API_URL}/leads/`, { method: 'GET', headers: { 'Accept': 'application/json' } });
    if (res.ok) {
      const data = await res.json();
      const list = Array.isArray(data) ? data : (data.leads || data.items || []);
      if (Array.isArray(list) && list.length > 0) {
        backendConnected = true;
        // Bind live PostgreSQL records directly to state.leads
        state.leads = list.map((item, idx) => ({
          id: String(item.id),
          db_id: item.id,
          name: item.name || 'Unnamed Lead',
          email: item.email || '',
          company: item.company || 'Unknown Co',
          status: item.status || 'New',
          score: Number(item.score) || 75,
          rep: idx % reps.length,
          source: item.source || 'Website',
          value: 25000 + (idx * 4000),
          priority: item.priority || 'Medium',
          phone: item.phone || '',
          industry: item.industry || 'Software & technology',
          company_size: item.company_size || '51-200',
          message: item.message || 'Live lead from PostgreSQL database.',
          events: [
            { title: 'Stored in PostgreSQL', text: `Database record #${item.id} received from GET /leads/`, at: item.created_at || new Date().toLocaleTimeString() }
          ]
        }));
        persist();
        render();
      }
    }
  } catch (err) {
    backendConnected = false;
  }
}

// Live Synchronizer with FastAPI Users endpoint (http://localhost:8000/users/)
async function syncUsersFromBackend() {
  try {
    const res = await fetch(`${API_URL}/users/`);
    if (res.ok) {
      const data = await res.json();
      const list = data.users || (Array.isArray(data) ? data : []);
      if (Array.isArray(list) && list.length > 0) {
        reps = list.map(u => ({
          id: u.id,
          name: u.name,
          initials: u.name.split(' ').map(n=>n[0]).join(''),
          role: `${u.role} (${u.team || 'Sales'})`,
          availability: u.status || 'Available',
          quota: Math.round(Number(u.workload) || 70)
        }));
        render();
      }
    }
  } catch (err) {
    console.warn('Could not fetch users from backend:', err);
  }
}

// Live Single Lead fetcher using GET /leads/{id}
async function fetchLeadDetail(id) {
  const numericId = String(id).replace(/^lead-/, '');
  if (!numericId || isNaN(numericId)) return;
  try {
    const res = await fetch(`${API_URL}/leads/${numericId}`);
    if (res.ok) {
      const item = await res.json();
      const existingIdx = state.leads.findIndex(x => String(x.id) === String(id) || String(x.id) === numericId || String(x.db_id) === numericId);
      const mapped = {
        id: String(item.id),
        db_id: item.id,
        name: item.name || 'Unnamed Lead',
        email: item.email || '',
        company: item.company || 'Unknown Co',
        status: item.status || 'New',
        score: Number(item.score) || 75,
        rep: existingIdx >= 0 ? state.leads[existingIdx].rep : 0,
        source: item.source || 'Website',
        value: 25000 + (item.id * 3500),
        priority: item.priority || 'Medium',
        phone: item.phone || '',
        industry: item.industry || 'Software & technology',
        company_size: item.company_size || '51-200',
        message: item.message || 'Live lead from PostgreSQL database.',
        events: [
          { title: 'Live record from PostgreSQL', text: `GET /leads/${item.id} returned HTTP 200 OK`, at: item.created_at || new Date().toLocaleTimeString() }
        ]
      };
      if (existingIdx >= 0) {
        state.leads[existingIdx] = mapped;
      } else {
        state.leads.unshift(mapped);
      }
      persist();
      render();
    }
  } catch (err) {
    console.warn('GET /leads/{id} failed', err);
  }
}

async function submitLead(e){
  e.preventDefault();
  const data=Object.fromEntries(new FormData(e.target));
  const calcScore = Math.min(100,35+(data.company?20:0)+(data.message?25:0)+(data.phone?10:0));
  
  let backendLead = null;
  try {
    const payload = {
      name: data.name.trim(),
      company: data.company.trim(),
      email: data.email.trim(),
      phone: data.phone?.trim() || null,
      source: data.source || 'Website',
      score: calcScore,
      priority: data.priority || 'Medium',
      status: 'New',
      industry: data.industry || 'Software & technology',
      company_size: data.company_size || '11-50',
      message: data.message?.trim() || null
    };
    const res = await fetch(`${API_URL}/leads/`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify(payload)
    });
    if (res.ok) {
      backendLead = await res.json();
    } else {
      const err = await res.json().catch(() => ({}));
      console.warn('Backend responded with error', res.status, err);
    }
  } catch (err) {
    console.warn('Backend POST error', err);
  }

  const finalId = backendLead ? String(backendLead.id) : ('lead-' + crypto.randomUUID());
  const l = {
    ...data,
    id: finalId,
    db_id: backendLead?.id || null,
    name: data.name.trim(),
    company: data.company.trim(),
    email: data.email.trim(),
    rep: Number(data.rep) || 0,
    value: Number(data.value) || 25000,
    status: 'New',
    score: calcScore,
    industry: data.industry || 'Software & technology',
    company_size: data.company_size || '11-50',
    events: [{
      title: 'Lead created in PostgreSQL',
      text: backendLead ? `Saved to DB via POST /leads/ with ID #${backendLead.id}` : 'Saved locally',
      at: new Date().toLocaleString()
    }]
  };
  state.leads.unshift(l);
  persist();
  await syncFromBackend();
  go('leads/' + finalId);
  toast(backendLead ? `Lead #${backendLead.id} created and committed to PostgreSQL!` : 'Lead created.');
}

function parseCSV(text){const rows=[];let row=[],field='',quoted=false;text=text.replace(/^\uFEFF/,'');for(let i=0;i<text.length;i++){let c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){field+='"';i++}else quoted=!quoted}else if(c===','&&!quoted){row.push(field);field=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&text[i+1]==='\n')i++;row.push(field);if(row.some(x=>x.trim()))rows.push(row);row=[];field=''}else field+=c}if(quoted)throw Error('An opening quote is missing its closing quote. Please check your CSV.');row.push(field);if(row.some(x=>x.trim()))rows.push(row);return rows}
async function processFile(file){if(!file||importBusy)return;if(!/\.csv$/i.test(file.name)){toast('Please choose a CSV file.');return}if(file.size>10*1024*1024){toast('This file is larger than 10 MB. Split it into smaller files.');return}importBusy=true;try{const rows=parseCSV(await file.text());if(rows.length<2)throw Error('Your file needs a header row and at least one lead.');const headers=rows.shift().map(x=>x.trim().toLowerCase());if(!['name','email','company'].every(h=>headers.includes(h)))throw Error('Required column headers: name, email, company.');const seen=new Set(state.leads.map(l=>(l.email||'').toLowerCase()));const accepted=[];const result={added:0,duplicates:0,errors:[]};const progress=document.getElementById('importprogress');if(progress)progress.style.display='block';for(let i=0;i<rows.length;i++){const r=Object.fromEntries(headers.map((h,j)=>[h,(rows[i][j]||'').trim()]));if(!r.name||!r.company||!/^\S+@\S+\.\S+$/.test(r.email)){result.errors.push({row:i+2,email:r.email,reason:'Missing name/company or invalid email'})}else if(seen.has(r.email.toLowerCase()))result.duplicates++;else if(r.value&&(isNaN(Number(r.value))||Number(r.value)<0)){result.errors.push({row:i+2,email:r.email,reason:'Value must be a non-negative number'})}else{seen.add(r.email.toLowerCase());accepted.push({id:'lead-'+crypto.randomUUID(),name:r.name,email:r.email,company:r.company,value:Number(r.value)||0,source:['Website','Referral','LinkedIn','Event','Phone'].includes(r.source)?r.source:'CSV import',status:'New',priority:'Medium',rep:0,score:55,phone:'',message:'',events:[{title:'Lead imported from CSV',text:file.name,at:new Date().toLocaleString()}]});result.added++}if(i%250===0||i===rows.length-1){const percent=Math.round((i+1)/rows.length*100);if(document.getElementById('importbar')){document.getElementById('importbar').style.width=percent+'%';document.getElementById('importpercent').textContent=percent+'%'}await new Promise(r=>setTimeout(r,0))}}state.leads.push(...accepted);state.imports.unshift({file:file.name,added:result.added,duplicates:result.duplicates,date:new Date().toLocaleDateString()});importResult=result;persist();toast(`${result.added} leads imported. ${result.duplicates} duplicates skipped.`)}catch(e){toast(e.message)}finally{importBusy=false;render()}}

function showModal(title,content){const m=document.getElementById('modal');m.innerHTML=`<div class="modalhead between"><h2>${title}</h2><button class="iconbtn" onclick="closeModal()" aria-label="Close dialog">${icon('close',19)}</button></div><div class="modalbody">${content}</div>`;m.showModal()}
function closeModal(){document.getElementById('modal').close()}
function taskModal(lead=''){showModal('Create task',`<form onsubmit="submitTask(event)"><label class="field">Task title *<input name="title" required maxlength="180" placeholder="e.g. Send proposal to Sophie" autofocus></label><label class="field">Related lead<select name="lead"><option value="">General task</option>${state.leads.map(l=>`<option value="${l.id}" ${l.id===lead?'selected':''}>${esc(l.name)} · ${esc(l.company)}</option>`).join('')}</select></label><div class="formgrid"><label class="field">Due date *<input name="due" type="date" value="2026-10-03" required></label><label class="field">Priority<select name="priority">${options(['High','Medium','Low'],'Medium')}</select></label></div><label class="field" style="margin-top:16px">Assigned rep<select name="rep">${reps.map((r,i)=>`<option value="${i}">${r.name}</option>`).join('')}</select></label><div class="flex" style="justify-content:flex-end;margin-top:22px"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" type="submit">Create task</button></div></form>`)}
function submitTask(e){e.preventDefault();const d=Object.fromEntries(new FormData(e.target));if(!d.title.trim())return;state.tasks.unshift({...d,title:d.title.trim(),id:'task-'+crypto.randomUUID(),rep:Number(d.rep),done:false});persist();closeModal();render();toast('Task created.')}
function assignModal(id){const l=state.leads.find(x=>x.id===id);showModal('Reassign lead',`<form onsubmit="event.preventDefault();assignRep('${id}',Number(this.rep.value))"><p class="muted" style="margin-bottom:20px">Reassign ${esc(l.name)} to a member of your team.</p><label class="field">Assigned representative<select name="rep">${reps.map((r,i)=>`<option value="${i}" ${l.rep===i?'selected':''}>${r.name} · ${r.availability}</option>`).join('')}</select></label><button class="btn primary" style="width:100%" type="submit">Save assignment</button></form>`)}
function assignRep(id,r){const l=state.leads.find(x=>x.id===id);l.rep=r;l.events.push({title:'Lead reassigned',text:'Ownership updated to '+reps[r].name+'.',at:new Date().toLocaleString()});persist();closeModal();render();toast('Lead assigned to '+reps[r].name)}
function activityModal(id){showModal('Log activity',`<form onsubmit="event.preventDefault();logActivity('${id}',this.type.value,this.message.value)"><label class="field">Activity type<select name="type">${options(['Note added','Email sent','Call completed','Meeting held'],'Note added')}</select></label><label class="field">What happened? *<textarea name="message" rows="4" required maxlength="2000" placeholder="Capture the key points and next steps..."></textarea></label><button class="btn primary" type="submit" style="width:100%">Log activity</button></form>`)}
function logActivity(id,title,text){if(!text.trim())return;const l=state.leads.find(x=>x.id===id);l.events.push({title,text:text.trim(),at:new Date().toLocaleString()});persist();closeModal();render();toast('Activity added to the timeline.')}
function convertModal(id){const l=state.leads.find(x=>x.id===id);showModal(l.status==='Won'?'Deal details':'Convert to won deal',`<p class="muted" style="margin-bottom:22px">${l.status==='Won'?'This opportunity is marked as won.':'Confirm that this opportunity has closed. This will move the lead to Won and record the event.'}</p><div class="panel panelbody"><div class="between"><strong>${esc(l.company)}</strong><strong class="green">${money(l.value||25000)}</strong></div><p class="muted small" style="margin-top:6px">${esc(l.name)} · ${esc(reps[l.rep||0]?.name||'Alex')}</p></div><div class="flex" style="justify-content:flex-end;margin-top:22px"><button class="btn" onclick="closeModal()">${l.status==='Won'?'Close':'Cancel'}</button>${l.status==='Won'?'':`<button class="btn primary" onclick="closeModal();changeStatus('${l.id}','Won')">Confirm won deal</button>`}</div>`)}
function repModal(i){const ls=state.leads.filter(l=>l.rep===i);showModal(reps[i].name+'’s pipeline',`<p class="muted small" style="margin-bottom:20px">${ls.length} assigned opportunities · ${money(ls.reduce((n,l)=>n+(l.value||25000),0))} total value</p>${ls.map(l=>`<a href="#/leads/${l.id}" onclick="closeModal()" class="between" style="padding:13px 0;border-top:1px solid var(--line)"><span><strong>${esc(l.name)}</strong><br><span class="muted small">${esc(l.company)}</span></span>${pill(l.status)}</a>`).join('')||'<p class="muted">No assigned leads yet.</p>'}`)}
function help(){showModal('Workspace shortcuts',`<div class="stack"><p class="muted">Explore every screen using the sidebar. Connected live to your FastAPI server.</p><div class="between"><span>Search leads</span><span class="kbd">Ctrl / ⌘ K</span></div><div class="between"><span>Close a dialog</span><span class="kbd">Esc</span></div><div class="divider"></div><p class="muted small">Try adding a lead (saves directly to PostgreSQL), moving a card on the board, logging a call, creating a task, or importing a CSV.</p><a class="btn" href="#/landing" onclick="closeModal()">Visit product website</a></div>`)}
function searchModal(){showModal('Search workspace',`<label class="searchbox" style="max-width:none">${icon('search',17)}<input id="globalsearch" placeholder="Search people or companies..." aria-label="Search all leads" autofocus oninput="searchResults(this.value)"></label><div id="searchresults" style="max-height:340px;overflow-y:auto;margin-top:18px"></div>`);searchResults('');setTimeout(()=>document.getElementById('globalsearch')?.focus(),0)}
function searchResults(q){const matches=state.leads.filter(l=>((l.name||'')+' '+(l.company||'')+' '+(l.email||'')).toLowerCase().includes(q.toLowerCase())).slice(0,8);document.getElementById('searchresults').innerHTML=matches.map(l=>`<a href="#/leads/${l.id}" onclick="closeModal()" class="between" style="padding:12px 0;border-bottom:1px solid var(--line)"><span><strong style="font-size:13px">${esc(l.name)}</strong><br><span class="muted small">${esc(l.company)}</span></span>${pill(l.status||'New')}</a>`).join('')||'<p class="muted" style="padding:15px 0">No leads match that search.</p>'}
function notificationPopover(){const old=document.getElementById('notepop');if(old){old.remove();return}const el=document.createElement('section');el.id='notepop';el.className='panel popover';el.innerHTML=`<div class="panelhead between"><h2>Notifications</h2><button class="iconbtn" aria-label="Close notifications" onclick="document.getElementById('notepop').remove()">${icon('close',15)}</button></div>${state.notes.slice(0,3).map(n=>`<a class="note" style="display:block" href="#/${n.route}" onclick="markRead('${n.id}',false)"><strong>${n.title}</strong><p>${n.text}</p></a>`).join('')}<a class="feedfoot" href="#/notifications">View all notifications</a>`;document.querySelector('.main').appendChild(el)}
function dateModal(){showModal('Select reporting period',`<p class="muted" style="margin-bottom:20px">Select the time window for the illustrative acquisition chart. Pipeline metrics reflect the current demo records.</p><div class="flex" style="justify-content:center">${['7D','30D','90D'].map(r=>`<button class="btn ${chartRange===r?'primary':''}" onclick="closeModal();setRange('${r}')">${r==='7D'?'Last 7 days':r==='30D'?'Last 30 days':'Last 90 days'}</button>`).join('')}</div>`)}
function setRange(r){chartRange=r;render()}
function downloadCSV(name,rows){const csv=rows.map(row=>row.map(value=>{let s=String(value??'');if(/^[=+@\-]/.test(s))s="'"+s;return '"'+s.replaceAll('"','""')+'"'}).join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Your download is ready.')}
function exportLeads(){const ls=location.hash.startsWith('#/leads')?filtered():state.leads;downloadCSV('launchpad-leads.csv',[['name','email','company','status','score','assigned_rep','source','value'],...ls.map(l=>[l.name,l.email,l.company,l.status,l.score,reps[l.rep||0]?.name||'Unassigned',l.source||'Website',l.value||25000])])}
function exportReport(){const total=state.leads.length,won=state.leads.filter(l=>l.status==='Won');downloadCSV('launchpad-pipeline-report.csv',[['metric','value','scope'],['Total leads',total,'Live database records'],['Qualified pipeline',state.leads.filter(l=>['Qualified','Demo'].includes(l.status)).reduce((n,l)=>n+(l.value||25000),0),'Live database records'],['Open pipeline',state.leads.filter(l=>l.status!=='Won').reduce((n,l)=>n+(l.value||25000),0),'Live database records'],['Won revenue',won.reduce((n,l)=>n+(l.value||25000),0),'Live database records'],['Win rate (%)',total?(won.length/total*100).toFixed(1):0,'Won leads / all leads'],...['New','Contacted','Qualified','Demo','Won'].map(s=>[s+' leads',state.leads.filter(l=>l.status===s).length,'Live database records'])])}
function render(){const route=location.hash.replace(/^#\/?/,'')||'dashboard';let body;switch(route){case'landing':document.getElementById('app').innerHTML=landing();document.title='LaunchPad — Your revenue workspace';return;case'login':document.getElementById('app').innerHTML=login();document.title='Sign in · LaunchPad';return;case'dashboard':body=dashboard();break;case'leads':body=leads();break;case'leads/new':body=createLead();break;case'tasks':body=tasks();break;case'analytics':body=analytics();break;case'team':body=team();break;case'imports':body=imports();break;case'notifications':body=notifications();break;default:body=route.startsWith('leads/')?detail(route.slice(6)):`<div class="empty"><h1>Page not found</h1>${btn('Back to overview','dashboard')}</div>`}document.getElementById('app').innerHTML=shell(route,body);document.title=(route==='dashboard'?'Overview':route==='leads/new'?'New lead':route.startsWith('leads/')?'Lead details':route[0].toUpperCase()+route.slice(1))+' · LaunchPad'}
window.addEventListener('hashchange',()=>{closeModal();render();window.scrollTo(0,0);const cur=location.hash.replace(/^#\/?/,'');if(cur.startsWith('leads/')&&cur!=='leads/new'){fetchLeadDetail(cur.slice(6))}else if(cur==='leads'||cur==='dashboard'||cur===''){syncFromBackend()}});
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key==='k'){e.preventDefault();if(document.getElementById('modal').open)closeModal();searchModal()}});
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal'){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeModal()}});
function sortLeadsBy(key){if(!['name','score','value'].includes(key))return;window.leadSortDirection=window.leadSortKey===key?-(window.leadSortDirection||1):(key==='name'?1:-1);window.leadSortKey=key;state.leads.sort((a,b)=>(typeof a[key]==='string'?a[key].localeCompare(b[key]):a[key]-b[key])*window.leadSortDirection);persist();render();toast('Sorted by '+key+' · '+(window.leadSortDirection===1?'ascending':'descending'))}
function updateSelection(){const checked=[...document.querySelectorAll('.rowcheck:checked')];const bar=document.getElementById('bulkbar');if(bar){bar.classList.toggle('show',checked.length>0);document.getElementById('selectedcount').textContent=checked.length+' selected'}}
function selectedLeads(){const ids=new Set([...document.querySelectorAll('.rowcheck:checked')].map(x=>x.value));return state.leads.filter(l=>ids.has(l.id))}
function exportSelected(){const ls=selectedLeads();if(!ls.length)return;downloadCSV('launchpad-selected-leads.csv',[['name','email','company','status','score','owner','value'],...ls.map(l=>[l.name,l.email,l.company,l.status,l.score,reps[l.rep||0]?.name||'Alex',l.value||25000])])}
function bulkAssignModal(){window.bulkLeadIds=selectedLeads().map(l=>l.id);showModal('Assign owner',`<p class="muted small" style="margin-bottom:20px">Update the owner of ${window.bulkLeadIds.length} selected leads.</p><form onsubmit="event.preventDefault();bulkAssign(Number(this.rep.value))"><label class="field">Representative<select name="rep">${reps.map((r,i)=>`<option value="${i}">${r.name}</option>`).join('')}</select></label><button type="submit" class="btn primary" style="width:100%">Save assignment</button></form>`)}
function bulkAssign(rep){const ls=state.leads.filter(l=>window.bulkLeadIds.includes(l.id));ls.forEach(l=>{l.rep=rep;l.events.push({title:'Lead reassigned',text:'Ownership updated to '+reps[rep].name+'.',at:new Date().toLocaleString()})});persist();closeModal();render();toast(ls.length+' leads assigned to '+reps[rep].name)}
render();
if(document.modelContext?.registerTool){try{Promise.resolve(document.modelContext.registerTool({name:'search_launchpad_leads',description:'Search the demo leads visible in the LaunchPad workspace.',inputSchema:{type:'object',properties:{query:{type:'string'}},required:['query'],additionalProperties:false},annotations:{readOnlyHint:true,untrustedContentHint:true},execute(input){if(typeof input?.query!=='string')throw Error('query must be a string');return state.leads.filter(l=>((l.name||'')+' '+(l.company||'')+' '+(l.email||'')).toLowerCase().includes(input.query.toLowerCase())).slice(0,30).map(l=>({id:l.id,name:l.name,company:l.company,status:l.status,score:l.score}))}})).catch(()=>{})}catch{}}
</script></body></html>
